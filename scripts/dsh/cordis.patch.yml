# Default-profile provider settings. DSH uses the local proxy on 127.0.0.1:1235
# (bin/dsh-mac-proxy.mjs, LaunchAgent com.tai.dsh-mac-proxy; source AI-Server-Docs/scripts).
# Since 2026-11-13 the default is qwen3.8-27b-as1 = Qwen3.8 27B on AI Server 1 (2x3090, llama.cpp :1241, 262k, vision);
# with it `dsh` does NOT turn on AI Server 2's LLM mode. flash-next (AI Server 2 Flash-Next, 262k) stays available:
# pick it with --model / the UI model menu, or set DSH_LLM_MODE=1 to warm AI Server 2 first (bin/dsh-llm-mode).
- id: llm-pi-ai
  config:
    providers:
      tai-ai-server:
        api: openai-completions
        baseURL: http://127.0.0.1:1235/v1
        defaultInput: [text, image]   # Flash-Next has vision since 2026-10-13 (mmproj on AS2 gufo)
        headers:              # keyless local proxy (it holds the real server keys); pi-ai needs some Authorization
          Authorization: Bearer local-proxy
        models:
          - id: qwen3.8-27b-as1
          - id: flash-next
          - id: qwen3.8-flash-next-uncensored-strix
          # older ids still resolve (the proxy sends every id to AI Server 2's Flash-Next)
          - id: qwen3.8-flash-next-uncensored
- id: agent-default-model
  config:
    provider: tai-ai-server
    model: qwen3.8-27b-as1
