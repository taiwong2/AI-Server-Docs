# Antoine's environment. Interop and automount OFF: with them on, any process
# here could run Windows programs as poopl or read C:\ -- i.e. own the box.
[boot]
command = /usr/local/sbin/pp-boot.sh

[interop]
enabled = false
appendWindowsPath = false

[automount]
enabled = false
mountFsTab = false

[user]
default = antoine

[network]
# The generated resolv.conf points at IPv6 DNS proxies that never answer here.
generateResolvConf = false
